[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
board_build.flash_size = 4MB
build_flags =
    -Iinclude
    -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^6.21.5
